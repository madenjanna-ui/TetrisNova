<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Журнал записей</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8faff);
    color: #202124;
    min-height: 100vh;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

header {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
    margin-bottom: 18px;
}

h1 {
    margin: 0 0 15px;
    font-size: 25px;
}

h2 {
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

select,
button,
input {
    font: inherit;
}

select {
    border: 0;
    background: #fff;
    padding: 12px 15px;
    border-radius: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

button {
    border: 0;
    border-radius: 13px;
    padding: 12px 16px;
    cursor: pointer;
    background: #635bff;
    color: white;
    font-weight: 600;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
    opacity: .92;
}

button.secondary {
    background: #e9e9f5;
    color: #333;
}

button.danger {
    background: #ff5c67;
}

.card {
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    text-align: left;
    font-size: 13px;
    color: #666;
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
}

td {
    padding: 8px;
    border-bottom: 1px solid #eee;
}

.number {
    width: 35px;
    color: #888;
    text-align: center;
}

.name {
    min-width: 180px;
}

.name input {
    width: 100%;
    border: 0;
    background: transparent;
    font-weight: 600;
    outline: none;
    padding: 9px 5px;
}

.data-input {
    width: 100%;
    max-width: 120px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 10px;
    padding: 9px;
    text-align: center;
    outline: none;
}

.data-input:focus,
.name input:focus {
    border-color: #635bff;
}

.summary {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.summary-box {
    background: rgba(255,255,255,.8);
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.summary-title {
    font-size: 12px;
    color: #777;
}

.summary-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
}

.result {
    margin-top: 20px;
}

.result h2 {
    font-size: 19px;
    margin: 0 0 12px;
}

.saved {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 12px;
}


/* =====================================
   МОДАЛЬНОЕ ОКНО ПРИСУТСТВИЯ
===================================== */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(20, 20, 40, .42);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 650px;
    max-height: 90vh;
    overflow-y: auto;
    background: rgba(255,255,255,.96);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    animation: modalShow .2s ease;
}

@keyframes modalShow {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}

.modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.modal-close {
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    background: #eeeeF7;
    color: #444;
    font-size: 24px;
    line-height: 40px;
}

.presence-month {
    width: 100%;
    margin-bottom: 15px;
}

.presence-card {
    overflow-x: auto;
}

.presence-table {
    min-width: 400px;
}

.presence-table th,
.presence-table td {
    text-align: center;
}

.presence-table th:first-child,
.presence-table td:first-child {
    text-align: left;
}

.presence-input {
    width: 80px;
    max-width: 100%;
    padding: 9px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
    outline: none;
    background: white;
}

.presence-input:focus {
    border-color: #635bff;
}

.presence-total {
    font-weight: 700;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-actions button {
    flex: 1;
}

.presence-saved {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}


/* =====================================
   КНОПКА ОБНОВЛЕНИЯ
===================================== */

.update-button {
    text-align: center;
    margin: 20px 0 10px;
}

.update-button button {
    background: rgba(255,255,255,.7);
    color: #666;
    border: 1px solid rgba(0,0,0,.08);
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: none;
}


/* =====================================
   МОБИЛЬНАЯ ВЕРСИЯ
===================================== */

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    header {
        border-radius: 17px;
        padding: 15px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 22px;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .controls select {
        grid-column: 1 / -1;
        width: 100%;
    }

    .controls button {
        width: 100%;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        border-radius: 20px;
        padding: 15px;
        max-height: 94vh;
    }

    .modal-header h2 {
        font-size: 18px;
    }

    .modal-actions {
        flex-direction: column;
    }

    .presence-input {
        width: 65px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- =========================
         ШАПКА
    ========================== -->

    <header>

        <h1>📋 Журнал записей</h1>

        <div class="controls">

            <select id="month"></select>

            <button onclick="saveData()">
                💾 Сохранить
            </button>

            <button class="secondary" onclick="togglePresence()">
                👥
            </button>

            <button class="secondary" onclick="clearMonth()">
                Очистить месяц
            </button>

        </div>

        <div class="saved" id="savedMessage">
            Выберите месяц
        </div>

    </header>


    <!-- =========================
         ОСНОВНАЯ ТАБЛИЦА
    ========================== -->

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th class="number">№</th>
                    <th>Кто</th>
                    <th>Участие</th>
                    <th>Уроки</th>
                    <th>Баллы</th>
                </tr>
            </thead>

            <tbody id="peopleTable"></tbody>

        </table>

    </div>


    <!-- =========================
         ИТОГИ
    ========================== -->

    <div class="summary">

        <div class="summary-box">

            <div class="summary-title">
                Участие / часы
            </div>

            <div class="summary-value" id="totalParticipation">
                0
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-title">
                Уроки
            </div>

            <div class="summary-value" id="totalLessons">
                0
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-title">
                Баллы
            </div>

            <div class="summary-value" id="totalPoints">
                0
            </div>

        </div>

    </div>


    <!-- =========================
         ИТОГОВАЯ ТАБЛИЦА
    ========================== -->

    <div class="card result">

        <h2>📊 Итог за месяц</h2>

        <table>

            <thead>

                <tr>
                    <th>Кто</th>
                    <th>Участие</th>
                    <th>Уроки</th>
                    <th>Баллы</th>
                </tr>

            </thead>

            <tbody id="resultTable"></tbody>

        </table>

    </div>


    <!-- =========================
         КНОПКА ОБНОВЛЕНИЯ
    ========================== -->

    <div class="update-button">

        <button onclick="location.reload()">
            ↻ Обновить
        </button>

    </div>

</div>


<!-- =====================================================
     МОДАЛЬНОЕ ОКНО ПРИСУТСТВИЯ
====================================================== -->

<div class="modal" id="presenceModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>👥 Присутствие учеников</h2>

            <button
                class="modal-close"
                onclick="togglePresence()"
                aria-label="Закрыть"
            >
                ×
            </button>

        </div>


        <!-- Выбор месяца для присутствия -->

        <select
            id="presenceMonth"
            class="presence-month"
        ></select>


        <div class="presence-card">

            <table class="presence-table">

                <thead>

                    <tr>
                        <th>Неделя</th>
                        <th>Будни</th>
                        <th>Вых.</th>
                    </tr>

                </thead>

                <tbody id="presenceTable"></tbody>

                <tfoot>

                    <tr>

                        <th>Итого</th>

                        <th
                            class="presence-total"
                            id="presenceWeekdaysTotal"
                        >
                            0
                        </th>

                        <th
                            class="presence-total"
                            id="presenceWeekendTotal"
                        >
                            0
                        </th>

                    </tr>

                </tfoot>

            </table>

        </div>


        <div class="modal-actions">

            <button onclick="savePresence()">
                💾 Сохранить
            </button>

            <button
                class="secondary"
                onclick="togglePresence()"
            >
                Закрыть
            </button>

        </div>


        <div
            class="presence-saved"
            id="presenceSavedMessage"
        ></div>

    </div>

</div>


<script>

/* =====================================
   НАСТРОЙКИ
===================================== */

const PEOPLE_COUNT = 30;

const months = [
    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"
];


/* =====================================
   ЭЛЕМЕНТЫ
===================================== */

const monthSelect =
    document.getElementById("month");

const peopleTable =
    document.getElementById("peopleTable");

const resultTable =
    document.getElementById("resultTable");

const presenceModal =
    document.getElementById("presenceModal");

const presenceMonth =
    document.getElementById("presenceMonth");

const presenceTable =
    document.getElementById("presenceTable");


/* =====================================
   СОЗДАНИЕ МЕСЯЦЕВ
===================================== */

function createMonthOptions(select) {

    select.innerHTML = "";

    months.forEach((month, index) => {

        const option =
            document.createElement("option");

        option.value = index + 1;
        option.textContent = month;

        select.appendChild(option);

    });

}


/* Основной выбор месяца */

createMonthOptions(monthSelect);

monthSelect.value =
    new Date().getMonth() + 1;


/* Выбор месяца в присутствии */

createMonthOptions(presenceMonth);

presenceMonth.value =
    monthSelect.value;


/* =====================================
   ОБЩИЙ СПИСОК УЧАСТНИКОВ
===================================== */

function getPeopleNames() {

    const saved =
        JSON.parse(
            localStorage.getItem("journal-people")
            || "null"
        );

    if (
        saved &&
        Array.isArray(saved)
    ) {

        return saved;

    }

    return Array(PEOPLE_COUNT).fill("");

}


function savePeopleNames() {

    const names = [];

    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        const input =
            document.getElementById(
                `name-${i}`
            );

        if (input) {
            names.push(input.value);
        } else {
            names.push("");
        }

    }

    localStorage.setItem(
        "journal-people",
        JSON.stringify(names)
    );

}


/* =====================================
   СОЗДАНИЕ УЧАСТНИКОВ
===================================== */

function createPeople() {

    peopleTable.innerHTML = "";

    const names = getPeopleNames();

    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        const tr =
            document.createElement("tr");

        const tdNumber =
            document.createElement("td");

        tdNumber.className = "number";
        tdNumber.textContent = i;

        const tdName =
            document.createElement("td");

        tdName.className = "name";

        const nameInput =
            document.createElement("input");

        nameInput.type = "text";
        nameInput.id = `name-${i}`;
        nameInput.placeholder = `Имя ${i}`;
        nameInput.value =
            names[i - 1] || "";

        nameInput.addEventListener(
            "input",
            () => {
                savePeopleNames();
                updateResult();
            }
        );

        tdName.appendChild(nameInput);


        const tdParticipation =
            document.createElement("td");

        const participationInput =
            document.createElement("input");

        participationInput.className =
            "data-input";

        participationInput.id =
            `participation-${i}`;

        participationInput.placeholder =
            "+ или часы";

        participationInput.addEventListener(
            "input",
            updateResult
        );

        tdParticipation.appendChild(
            participationInput
        );


        const tdLessons =
            document.createElement("td");

        const lessonsInput =
            document.createElement("input");

        lessonsInput.className =
            "data-input";

        lessonsInput.id =
            `lessons-${i}`;

        lessonsInput.type =
            "number";

        lessonsInput.min = "0";

        lessonsInput.placeholder = "0";

        lessonsInput.addEventListener(
            "input",
            updateResult
        );

        tdLessons.appendChild(
            lessonsInput
        );


        const tdPoints =
            document.createElement("td");

        const pointsInput =
            document.createElement("input");

        pointsInput.className =
            "data-input";

        pointsInput.id =
            `points-${i}`;

        pointsInput.type =
            "number";

        pointsInput.min = "0";

        pointsInput.placeholder = "0";

        pointsInput.addEventListener(
            "input",
            updateResult
        );

        tdPoints.appendChild(
            pointsInput
        );


        tr.appendChild(tdNumber);
        tr.appendChild(tdName);
        tr.appendChild(tdParticipation);
        tr.appendChild(tdLessons);
        tr.appendChild(tdPoints);

        peopleTable.appendChild(tr);

    }

}


/* =====================================
   КЛЮЧ ОСНОВНОГО МЕСЯЦА
===================================== */

function storageKey() {

    return "journal-month-" +
        monthSelect.value;

}


/* =====================================
   ЗАГРУЗКА ОСНОВНОГО МЕСЯЦА
===================================== */

function loadMonth() {

    const data =
        JSON.parse(
            localStorage.getItem(
                storageKey()
            ) || "null"
        );


    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        const participation =
            document.getElementById(
                `participation-${i}`
            );

        const lessons =
            document.getElementById(
                `lessons-${i}`
            );

        const points =
            document.getElementById(
                `points-${i}`
            );


        participation.value =
            data?.people?.[i - 1]?.participation
            || "";

        lessons.value =
            data?.people?.[i - 1]?.lessons
            || "";

        points.value =
            data?.people?.[i - 1]?.points
            || "";

    }


    updateResult();


    /* Синхронизируем месяц присутствия */

    presenceMonth.value =
        monthSelect.value;


    document.getElementById(
        "savedMessage"
    ).textContent = data
        ? "Записи загружены"
        : "Для этого месяца записей пока нет";


    /* Если окно присутствия открыто —
       загружаем соответствующий месяц */

    if (
        presenceModal.classList.contains("show")
    ) {

        createPresenceTable();
        loadPresence();

    }

}


/* =====================================
   СОХРАНЕНИЕ ОСНОВНЫХ ДАННЫХ
===================================== */

function saveData() {

    savePeopleNames();

    const people = [];

    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        people.push({

            participation:
                document.getElementById(
                    `participation-${i}`
                ).value,

            lessons:
                document.getElementById(
                    `lessons-${i}`
                ).value,

            points:
                document.getElementById(
                    `points-${i}`
                ).value

        });

    }


    localStorage.setItem(

        storageKey(),

        JSON.stringify({
            people: people
        })

    );


    document.getElementById(
        "savedMessage"
    ).textContent =
        "✓ Сохранено";

}


/* =====================================
   ИТОГОВАЯ ТАБЛИЦА
===================================== */

function updateResult() {

    resultTable.innerHTML = "";

    let totalLessons = 0;
    let totalPoints = 0;
    let totalHours = 0;


    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        const name =
            document.getElementById(
                `name-${i}`
            ).value.trim();

        const participation =
            document.getElementById(
                `participation-${i}`
            ).value.trim();

        const lessons =
            Number(
                document.getElementById(
                    `lessons-${i}`
                ).value
            ) || 0;

        const points =
            Number(
                document.getElementById(
                    `points-${i}`
                ).value
            ) || 0;


        totalLessons += lessons;
        totalPoints += points;


        /*
         * Если указано число —
         * считаем его как часы.
         *
         * Если указано "+" —
         * просто показываем участие,
         * но в часы его не прибавляем.
         */

        if (
            participation !== "+" &&
            participation !== "" &&
            !isNaN(Number(participation))
        ) {

            totalHours +=
                Number(participation);

        }


        if (
            name ||
            participation ||
            lessons ||
            points
        ) {

            const tr =
                document.createElement("tr");


            const tdName =
                document.createElement("td");

            tdName.textContent =
                name || "Без имени";


            const tdParticipation =
                document.createElement("td");

            tdParticipation.textContent =
                participation || "—";


            const tdLessons =
                document.createElement("td");

            tdLessons.textContent =
                lessons;


            const tdPoints =
                document.createElement("td");

            tdPoints.textContent =
                points;


            tr.appendChild(tdName);
            tr.appendChild(tdParticipation);
            tr.appendChild(tdLessons);
            tr.appendChild(tdPoints);


            resultTable.appendChild(tr);

        }

    }


    document.getElementById(
        "totalParticipation"
    ).textContent =
        totalHours > 0
            ? totalHours + " ч"
            : "—";


    document.getElementById(
        "totalLessons"
    ).textContent =
        totalLessons;


    document.getElementById(
        "totalPoints"
    ).textContent =
        totalPoints;

}


/* =====================================
   ПРИСУТСТВИЕ 👥
===================================== */

function togglePresence() {

    if (
        presenceModal.classList.contains("show")
    ) {

        presenceModal.classList.remove("show");

        return;

    }


    /*
     * При открытии берём тот же месяц,
     * который выбран в основном журнале.
     */

    presenceMonth.value =
        monthSelect.value;


    createPresenceTable();

    loadPresence();

    presenceModal.classList.add("show");

}


/* =====================================
   ЗАКРЫТИЕ ПО КЛИКУ ПО ФОНУ
===================================== */

presenceModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === presenceModal
        ) {

            togglePresence();

        }

    }
);


/* =====================================
   ESC — ЗАКРЫТЬ ОКНО
===================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            presenceModal.classList.contains("show")
        ) {

            togglePresence();

        }

    }
);


/* =====================================
   СОЗДАНИЕ ТАБЛИЦЫ ПРИСУТСТВИЯ
===================================== */

function createPresenceTable() {

    presenceTable.innerHTML = "";


    for (let i = 1; i <= 5; i++) {

        const tr =
            document.createElement("tr");


        const week =
            document.createElement("td");

        week.textContent =
            `${i} неделя`;


        const weekdayCell =
            document.createElement("td");

        const weekdayInput =
            document.createElement("input");

        weekdayInput.type =
            "number";

        weekdayInput.min =
            "0";

        weekdayInput.className =
            "presence-input";

        weekdayInput.id =
            `presence-weekday-${i}`;

        weekdayInput.addEventListener(
            "input",
            calculatePresence
        );

        weekdayCell.appendChild(
            weekdayInput
        );


        const weekendCell =
            document.createElement("td");

        const weekendInput =
            document.createElement("input");

        weekendInput.type =
            "number";

        weekendInput.min =
            "0";

        weekendInput.className =
            "presence-input";

        weekendInput.id =
            `presence-weekend-${i}`;

        weekendInput.addEventListener(
            "input",
            calculatePresence
        );

        weekendCell.appendChild(
            weekendInput
        );


        tr.appendChild(week);
        tr.appendChild(weekdayCell);
        tr.appendChild(weekendCell);


        presenceTable.appendChild(tr);

    }

}


/* =====================================
   КЛЮЧ ПРИСУТСТВИЯ
===================================== */

function presenceKey() {

    return "journal-presence-" +
        presenceMonth.value;

}


/* =====================================
   СОХРАНИТЬ ПРИСУТСТВИЕ
===================================== */

function savePresence() {

    const weeks = [];


    for (let i = 1; i <= 5; i++) {

        const weekday =
            document.getElementById(
                `presence-weekday-${i}`
            );

        const weekend =
            document.getElementById(
                `presence-weekend-${i}`
            );


        weeks.push({

            weekdays:
                weekday.value,

            weekend:
                weekend.value

        });

    }


    localStorage.setItem(

        presenceKey(),

        JSON.stringify(weeks)

    );


    document.getElementById(
        "presenceSavedMessage"
    ).textContent =
        "✓ Присутствие сохранено";

}


/* =====================================
   ЗАГРУЗИТЬ ПРИСУТСТВИЕ
===================================== */

function loadPresence() {

    const data =
        JSON.parse(
            localStorage.getItem(
                presenceKey()
            ) || "null"
        );


    /*
     * Сначала очищаем все поля.
     */

    for (let i = 1; i <= 5; i++) {

        const weekday =
            document.getElementById(
                `presence-weekday-${i}`
            );

        const weekend =
            document.getElementById(
                `presence-weekend-${i}`
            );


        if (weekday) {
            weekday.value = "";
        }

        if (weekend) {
            weekend.value = "";
        }

    }


    /*
     * Если сохранённых данных нет —
     * показываем пустую таблицу.
     */

    if (!data) {

        calculatePresence();

        document.getElementById(
            "presenceSavedMessage"
        ).textContent =
            "Для этого месяца данных пока нет";

        return;

    }


    /*
     * Загружаем сохранённые данные.
     */

    for (let i = 1; i <= 5; i++) {

        const weekday =
            document.getElementById(
                `presence-weekday-${i}`
            );

        const weekend =
            document.getElementById(
                `presence-weekend-${i}`
            );


        if (weekday) {

            weekday.value =
                data[i - 1]?.weekdays || "";

        }


        if (weekend) {

            weekend.value =
                data[i - 1]?.weekend || "";

        }

    }


    calculatePresence();


    document.getElementById(
        "presenceSavedMessage"
    ).textContent =
        "Данные загружены";

}


/* =====================================
   ИТОГ ПРИСУТСТВИЯ
===================================== */

function calculatePresence() {

    let weekdays = 0;
    let weekends = 0;


    document
        .querySelectorAll(".presence-input")
        .forEach(input => {

            const value =
                Number(input.value) || 0;


            if (
                input.id.includes("weekday")
            ) {

                weekdays += value;

            } else {

                weekends += value;

            }

        });


    document.getElementById(
        "presenceWeekdaysTotal"
    ).textContent =
        weekdays;


    document.getElementById(
        "presenceWeekendTotal"
    ).textContent =
        weekends;

}


/* =====================================
   ПЕРЕКЛЮЧЕНИЕ МЕСЯЦА ПРИСУТСТВИЯ
===================================== */

presenceMonth.addEventListener(
    "change",
    function() {

        createPresenceTable();

        loadPresence();

    }
);


/* =====================================
   ОЧИСТИТЬ МЕСЯЦ
===================================== */

function clearMonth() {

    const monthName =
        months[
            Number(monthSelect.value) - 1
        ];


    if (
        !confirm(
            "Удалить записи за " +
            monthName +
            "?"
        )
    ) {

        return;

    }


    /*
     * Удаляем основные записи.
     */

    localStorage.removeItem(
        storageKey()
    );


    /*
     * Удаляем отдельно данные
     * присутствия этого месяца.
     */

    localStorage.removeItem(
        "journal-presence-" +
        monthSelect.value
    );


    loadMonth();


    /*
     * Если окно присутствия открыто —
     * обновляем и его.
     */

    if (
        presenceModal.classList.contains("show")
    ) {

        presenceMonth.value =
            monthSelect.value;

        createPresenceTable();

        loadPresence();

    }

}


/* =====================================
   ПЕРЕКЛЮЧЕНИЕ ОСНОВНОГО МЕСЯЦА
===================================== */

monthSelect.addEventListener(
    "change",
    loadMonth
);


/* =====================================
   ЗАПУСК
===================================== */

createPeople();

loadMonth();

</script>
