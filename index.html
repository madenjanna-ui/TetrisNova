<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>📋 Журнал записей</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#eef3ff,#f8f9ff,#edf7ff);
    color:#20242b;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.9);
    border-radius:20px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 8px 30px rgba(60,80,120,.12);
    backdrop-filter:blur(10px);
}

h1{
    margin:0 0 14px;
    text-align:center;
    font-size:25px;
}

h2{
    margin:0 0 14px;
    font-size:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
}

select,
button,
input{
    font:inherit;
}

select{
    padding:10px 12px;
    border:1px solid #d8deeb;
    border-radius:12px;
    background:white;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 13px;
    cursor:pointer;
    background:#eef2f8;
}

button:active{
    transform:scale(.97);
}

.btn-save{
    background:#dff6e7;
}

.btn-backup{
    background:#e4efff;
}

.btn-restore{
    background:#fff0d9;
}

.btn-cloud{
    background:#e8e4ff;
}

.btn-danger{
    background:#ffe3e3;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#687386;
    min-height:18px;
}

.table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    background:#f0f3f8;
    font-weight:700;
}

th,
td{
    padding:8px;
    border-bottom:1px solid #e5e8ee;
    text-align:center;
}

td.name-cell{
    text-align:left;
    min-width:180px;
}

.name-input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    padding:8px;
    border-radius:8px;
}

.name-input:focus{
    border-color:#bfc9dc;
    background:white;
    outline:none;
}

.data-input{
    width:80px;
    padding:8px;
    border:1px solid #d8deeb;
    border-radius:8px;
    text-align:center;
    background:white;
}

/* ---------- ОБЩИЙ ИТОГ ---------- */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.summary-box{
    background:#f5f7fb;
    border-radius:14px;
    padding:13px 7px;
    text-align:center;
}

.summary-title{
    font-size:13px;
    color:#687386;
}

.summary-value{
    font-size:23px;
    font-weight:700;
    margin-top:4px;
}

.bottom{
    text-align:center;
    margin-top:12px;
}

.refresh{
    font-size:13px;
    padding:7px 11px;
    background:#f0f2f6;
}

/* ---------- ЗАПОЛНЕННЫЕ ЗАПИСИ ---------- */

.filled-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.filled-title h2{
    margin:0;
}

.filled-count{
    font-size:13px;
    color:#687386;
    background:#f2f4f8;
    padding:6px 10px;
    border-radius:20px;
}

.empty-message{
    text-align:center;
    padding:25px 10px;
    color:#8a94a5;
}

#filledTable td:nth-child(2){
    text-align:left;
}

/* ---------- MODAL ---------- */

.modal{
    position:fixed;
    inset:0;
    background:rgba(20,30,50,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:22px;
    padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.modal-head h2{
    margin:0;
}

.close{
    width:38px;
    height:38px;
    padding:0;
    border-radius:50%;
}

.presence-table{
    min-width:430px;
}

.presence-input{
    width:90px;
    padding:9px;
    border:1px solid #d8deeb;
    border-radius:9px;
    text-align:center;
}

.presence-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
}

.presence-box{
    padding:12px 6px;
    background:#f5f7fb;
    border-radius:13px;
    text-align:center;
}

.presence-box span{
    display:block;
    font-size:12px;
    color:#687386;
}

.presence-box strong{
    display:block;
    font-size:22px;
    margin-top:4px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

.info{
    margin-top:10px;
    padding:10px 12px;
    background:#f5f7fb;
    border-radius:12px;
    font-size:13px;
    color:#687386;
    text-align:center;
}

.file-input{
    display:none;
}

@media(max-width:650px){

    body{
        padding:8px;
    }

    .card{
        padding:11px;
        border-radius:16px;
    }

    h1{
        font-size:21px;
    }

    .controls{
        gap:6px;
    }

    .controls button,
    .controls select{
        padding:9px 10px;
        font-size:14px;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
        gap:6px;
    }

    .summary-box{
        padding:10px 5px;
    }

    .summary-value{
        font-size:20px;
    }

    .summary-title{
        font-size:12px;
    }

    .filled-title{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- ======================================================
     ШАПКА
====================================================== -->

<div class="card">

    <h1>📋 Журнал записей</h1>

    <div class="controls">

        <select id="monthSelect"></select>

        <button class="btn-save" id="saveBtn">
            💾 Сохранить
        </button>

        <button id="presenceBtn">
            👥 Посещение
        </button>

        <button class="btn-backup" id="backupBtn">
            💾 Резерв
        </button>

        <button class="btn-restore" id="restoreBtn">
            📂 Восстановить
        </button>

        <button class="btn-cloud" id="cloudBtn">
            ☁️
        </button>

        <button class="btn-danger" id="clearBtn">
            Очистить месяц
        </button>

    </div>

    <div id="status" class="status"></div>

    <input
        type="file"
        id="restoreFile"
        class="file-input"
        accept=".json,application/json"
    >

</div>


<!-- ======================================================
     ОСНОВНАЯ ТАБЛИЦА
====================================================== -->

<div class="card">

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>№</th>
                    <th>Кто</th>
                    <th>Участие</th>
                    <th>Уроки</th>
                    <th>Баллы</th>
                </tr>
            </thead>

            <tbody id="peopleBody"></tbody>

        </table>

    </div>


    <!-- ОБЩИЙ ИТОГ ПОСЕРЕДИНЕ -->

    <div class="summary">

        <div class="summary-box">
            <div class="summary-title">Участие +</div>
            <div class="summary-value" id="totalParticipation">0</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">Часы</div>
            <div class="summary-value" id="totalHours">0</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">Уроки</div>
            <div class="summary-value" id="totalLessons">0</div>
        </div>

        <div class="summary-box">
            <div class="summary-title">Баллы</div>
            <div class="summary-value" id="totalPoints">0</div>
        </div>

    </div>

    <div class="bottom">

        <button class="refresh" id="refreshBtn">
            ↻ Обновить
        </button>

    </div>

</div>


<!-- ======================================================
     ТОЛЬКО ЗАПОЛНЕННЫЕ ЗАПИСИ
====================================================== -->

<div class="card">

    <div class="filled-title">

        <h2 id="filledTitle">
            📄 Заполненные записи
        </h2>

        <div
            class="filled-count"
            id="filledCount"
        >
            0 записей
        </div>

    </div>


    <div
        id="emptyFilled"
        class="empty-message"
    >
        За этот месяц пока ничего не заполнено.
    </div>


    <div
        class="table-wrap"
        id="filledTableWrap"
        style="display:none"
    >

        <table id="filledTable">

            <thead>
                <tr>
                    <th>№</th>
                    <th>Кто</th>
                    <th>Участие</th>
                    <th>Уроки</th>
                    <th>Баллы</th>
                </tr>
            </thead>

            <tbody id="filledBody"></tbody>

        </table>

    </div>

</div>

</div>


<!-- ======================================================
     ПОСЕЩЕНИЕ
====================================================== -->

<div class="modal" id="presenceModal">

<div class="modal-box">

    <div class="modal-head">

        <h2>👥 Посещение</h2>

        <button
            class="close"
            id="closePresence"
        >
            ✕
        </button>

    </div>


    <select id="presenceMonth"></select>


    <div class="info">
        Посещение сохраняется отдельно для каждого месяца.
    </div>


    <div
        class="table-wrap"
        style="margin-top:15px"
    >

        <table class="presence-table">

            <thead>
                <tr>
                    <th>Неделя</th>
                    <th>Будни</th>
                    <th>Вых.</th>
                </tr>
            </thead>

            <tbody id="presenceBody"></tbody>

        </table>

    </div>


    <div class="presence-summary">

        <div class="presence-box">
            <span>Будни</span>
            <strong id="weekdayTotal">0</strong>
        </div>

        <div class="presence-box">
            <span>Выходные</span>
            <strong id="weekendTotal">0</strong>
        </div>

        <div class="presence-box">
            <span>Всего</span>
            <strong id="presenceGrandTotal">0</strong>
        </div>

    </div>


    <div class="modal-buttons">

        <button
            id="presenceSaveBtn"
            class="btn-save"
        >
            💾 Сохранить
        </button>

        <button id="presenceCloseBtn">
            Закрыть
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const PEOPLE_COUNT = 30;

const MONTHS = [
    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"
];

let currentMonth =
    new Date().getMonth() + 1;

let loadedPresenceMonth =
    currentMonth;

let autoSaveTimer = null;

let presenceAutoSaveTimer = null;


/* =========================================================
   КЛЮЧИ
========================================================= */

function storageKey(month){
    return "journal-month-" + month;
}

function presenceKey(month){
    return "journal-presence-" + month;
}

function monthName(month){
    return MONTHS[month - 1] || "";
}


/* =========================================================
   СТАТУС
========================================================= */

function setStatus(text,error = false){

    const status =
        document.getElementById("status");

    status.textContent = text;

    status.style.color =
        error ? "#c0392b" : "#687386";

    clearTimeout(setStatus.timer);

    setStatus.timer =
        setTimeout(() => {

            status.textContent = "";

        },3500);
}


/* =========================================================
   ЭКРАНИРОВАНИЕ
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* =========================================================
   МЕСЯЦЫ
========================================================= */

function createMonthOptions(){

    const main =
        document.getElementById(
            "monthSelect"
        );

    const presence =
        document.getElementById(
            "presenceMonth"
        );

    main.innerHTML = "";
    presence.innerHTML = "";

    MONTHS.forEach(
        (name,index) => {

            const number =
                index + 1;

            const option1 =
                document.createElement(
                    "option"
                );

            option1.value =
                number;

            option1.textContent =
                name;

            main.appendChild(
                option1
            );


            const option2 =
                document.createElement(
                    "option"
                );

            option2.value =
                number;

            option2.textContent =
                name;

            presence.appendChild(
                option2
            );

        }
    );

    main.value =
        currentMonth;

    presence.value =
        loadedPresenceMonth;
}


/* =========================================================
   ИМЕНА
========================================================= */

function getPeopleNames(){

    try{

        const saved =
            localStorage.getItem(
                "journal-people"
            );

        if(!saved){

            return Array(
                PEOPLE_COUNT
            ).fill("");
        }

        const names =
            JSON.parse(saved);

        const result =
            Array(
                PEOPLE_COUNT
            ).fill("");

        if(Array.isArray(names)){

            for(
                let i = 0;
                i < PEOPLE_COUNT;
                i++
            ){

                result[i] =
                    names[i] || "";
            }
        }

        return result;

    }
    catch(error){

        return Array(
            PEOPLE_COUNT
        ).fill("");
    }
}


function savePeopleNames(){

    const names = [];

    document
        .querySelectorAll(
            ".name-input"
        )
        .forEach(input => {

            names.push(
                input.value.trim()
            );

        });

    localStorage.setItem(
        "journal-people",
        JSON.stringify(names)
    );
}


/* =========================================================
   СОЗДАНИЕ ОСНОВНОЙ ТАБЛИЦЫ
========================================================= */

function createPeople(){

    const body =
        document.getElementById(
            "peopleBody"
        );

    body.innerHTML = "";

    const names =
        getPeopleNames();

    for(
        let i = 0;
        i < PEOPLE_COUNT;
        i++
    ){

        const tr =
            document.createElement(
                "tr"
            );

        tr.innerHTML = `

            <td>${i + 1}</td>

            <td class="name-cell">

                <input
                    class="name-input"
                    data-index="${i}"
                    value="${escapeHtml(names[i])}"
                    placeholder="Введите имя"
                >

            </td>

            <td>

                <input
                    class="data-input participation"
                    data-index="${i}"
                    type="text"
                    inputmode="decimal"
                    placeholder="+ / часы"
                >

            </td>

            <td>

                <input
                    class="data-input lessons"
                    data-index="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >

            </td>

            <td>

                <input
                    class="data-input points"
                    data-index="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >

            </td>
        `;

        body.appendChild(tr);
    }


    document
        .querySelectorAll(
            ".name-input"
        )
        .forEach(input => {

            input.addEventListener(
                "input",
                () => {

                    savePeopleNames();

                    updateFilledTable();

                    scheduleAutoSave();
                }
            );

        });


    document
        .querySelectorAll(
            ".data-input"
        )
        .forEach(input => {

            input.addEventListener(
                "input",
                () => {

                    updateResult();

                    updateFilledTable();

                    scheduleAutoSave();
                }
            );

        });
}


/* =========================================================
   СОХРАНЕНИЕ МЕСЯЦА
========================================================= */

function saveData(
    showMessage = false
){

    savePeopleNames();

    const data = [];

    for(
        let i = 0;
        i < PEOPLE_COUNT;
        i++
    ){

        const participation =
            document.querySelector(
                `.participation[data-index="${i}"]`
            )?.value.trim() || "";

        const lessons =
            document.querySelector(
                `.lessons[data-index="${i}"]`
            )?.value || "";

        const points =
            document.querySelector(
                `.points[data-index="${i}"]`
            )?.value || "";

        data.push({
            participation,
            lessons,
            points
        });
    }

    localStorage.setItem(
        storageKey(currentMonth),
        JSON.stringify(data)
    );

    if(showMessage){

        setStatus(
            "✓ " +
            monthName(currentMonth) +
            " сохранён"
        );
    }
}


/* =========================================================
   АВТОСОХРАНЕНИЕ
========================================================= */

function scheduleAutoSave(){

    clearTimeout(
        autoSaveTimer
    );

    autoSaveTimer =
        setTimeout(() => {

            saveData(false);

        },400);
}


/* =========================================================
   ЗАГРУЗКА МЕСЯЦА
========================================================= */

function loadMonth(){

    let data = [];

    try{

        const saved =
            localStorage.getItem(
                storageKey(
                    currentMonth
                )
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                Array.isArray(parsed)
            ){

                data = parsed;
            }
        }

    }
    catch(error){

        console.error(error);
    }


    document
        .querySelectorAll(
            ".participation"
        )
        .forEach(
            (input,index) => {

                input.value =
                    data[index]
                    ?.participation ?? "";
            }
        );


    document
        .querySelectorAll(
            ".lessons"
        )
        .forEach(
            (input,index) => {

                input.value =
                    data[index]
                    ?.lessons ?? "";
            }
        );


    document
        .querySelectorAll(
            ".points"
        )
        .forEach(
            (input,index) => {

                input.value =
                    data[index]
                    ?.points ?? "";
            }
        );


    updateResult();

    updateFilledTable();
}


/* =========================================================
   ОБЩИЙ ИТОГ
========================================================= */

function updateResult(){

    let participation = 0;

    let hours = 0;

    let lessons = 0;

    let points = 0;


    document
        .querySelectorAll(
            ".participation"
        )
        .forEach(input => {

            const raw =
                input.value
                    .trim()
                    .replace(",",".");

            if(raw === "+"){

                participation++;

                return;
            }

            if(raw !== ""){

                const number =
                    Number(raw);

                if(
                    Number.isFinite(
                        number
                    )
                ){

                    hours += number;
                }
            }

        });


    document
        .querySelectorAll(
            ".lessons"
        )
        .forEach(input => {

            if(
                input.value === ""
            ){
                return;
            }

            const number =
                Number(
                    input.value
                );

            if(
                Number.isFinite(
                    number
                )
            ){

                lessons += number;
            }

        });


    document
        .querySelectorAll(
            ".points"
        )
        .forEach(input => {

            if(
                input.value === ""
            ){
                return;
            }

            const number =
                Number(
                    input.value
                );

            if(
                Number.isFinite(
                    number
                )
            ){

                points += number;
            }

        });


    document.getElementById(
        "totalParticipation"
    ).textContent =
        participation;


    document.getElementById(
        "totalHours"
    ).textContent =
        formatNumber(hours);


    document.getElementById(
        "totalLessons"
    ).textContent =
        formatNumber(lessons);


    document.getElementById(
        "totalPoints"
    ).textContent =
        formatNumber(points);
}


function formatNumber(value){

    if(
        Number.isInteger(value)
    ){

        return String(value);
    }

    return String(
        Math.round(
            value * 100
        ) / 100
    );
}


/* =========================================================
   ТАБЛИЦА ЗАПОЛНЕННЫХ ЗАПИСЕЙ
========================================================= */

function updateFilledTable(){

    const body =
        document.getElementById(
            "filledBody"
        );

    const tableWrap =
        document.getElementById(
            "filledTableWrap"
        );

    const empty =
        document.getElementById(
            "emptyFilled"
        );

    const countBox =
        document.getElementById(
            "filledCount"
        );

    const title =
        document.getElementById(
            "filledTitle"
        );


    body.innerHTML = "";


    title.textContent =
        "📄 Заполненные записи — " +
        monthName(currentMonth);


    let count = 0;


    for(
        let i = 0;
        i < PEOPLE_COUNT;
        i++
    ){

        const name =
            document.querySelector(
                `.name-input[data-index="${i}"]`
            )?.value.trim() || "";


        const participation =
            document.querySelector(
                `.participation[data-index="${i}"]`
            )?.value.trim() || "";


        const lessons =
            document.querySelector(
                `.lessons[data-index="${i}"]`
            )?.value || "";


        const points =
            document.querySelector(
                `.points[data-index="${i}"]`
            )?.value || "";


        /*
            Строка считается заполненной,
            если есть хотя бы одно значение
            отчёта.

            Одного имени недостаточно.
        */

        const hasReport =
            participation !== "" ||
            lessons !== "" ||
            points !== "";


        if(!hasReport){

            continue;
        }


        count++;


        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

            <td>${count}</td>

            <td>
                ${escapeHtml(
                    name || "Без имени"
                )}
            </td>

            <td>
                ${escapeHtml(
                    participation || "—"
                )}
            </td>

            <td>
                ${escapeHtml(
                    lessons || "—"
                )}
            </td>

            <td>
                ${escapeHtml(
                    points || "—"
                )}
            </td>
        `;


        body.appendChild(tr);
    }


    countBox.textContent =
        count +
        " " +
        getRecordWord(count);


    if(count === 0){

        tableWrap.style.display =
            "none";

        empty.style.display =
            "block";

    }
    else{

        tableWrap.style.display =
            "block";

        empty.style.display =
            "none";
    }
}


function getRecordWord(number){

    const n =
        Math.abs(number) % 100;

    const n1 =
        n % 10;


    if(
        n > 10 &&
        n < 20
    ){

        return "записей";
    }


    if(n1 === 1){

        return "запись";
    }


    if(
        n1 >= 2 &&
        n1 <= 4
    ){

        return "записи";
    }


    return "записей";
}


/* =========================================================
   ТАБЛИЦА ПОСЕЩЕНИЯ
========================================================= */

function createPresenceTable(){

    const body =
        document.getElementById(
            "presenceBody"
        );

    body.innerHTML = "";


    for(
        let i = 0;
        i < 5;
        i++
    ){

        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

            <td>
                ${i + 1}
            </td>

            <td>

                <input
                    class="presence-input weekday"
                    data-week="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >

            </td>

            <td>

                <input
                    class="presence-input weekend"
                    data-week="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >

            </td>
        `;


        body.appendChild(tr);
    }


    document
        .querySelectorAll(
            ".presence-input"
        )
        .forEach(input => {

            input.addEventListener(
                "input",
                () => {

                    calculatePresence();

                    schedulePresenceAutoSave();
                }
            );

        });
}


/* =========================================================
   ЗАГРУЗКА ПОСЕЩЕНИЯ
========================================================= */

function loadPresence(month){

    loadedPresenceMonth =
        Number(month);


    document.getElementById(
        "presenceMonth"
    ).value =
        loadedPresenceMonth;


    let data = [];


    try{

        const saved =
            localStorage.getItem(
                presenceKey(
                    loadedPresenceMonth
                )
            );


        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                Array.isArray(parsed)
            ){

                data = parsed;
            }
        }

    }
    catch(error){

        console.error(error);
    }


    document
        .querySelectorAll(
            ".weekday"
        )
        .forEach(
            (input,index) => {

                input.value =
                    data[index]
                    ?.weekday ?? "";
            }
        );


    document
        .querySelectorAll(
            ".weekend"
        )
        .forEach(
            (input,index) => {

                input.value =
                    data[index]
                    ?.weekend ?? "";
            }
        );


    calculatePresence();
}


/* =========================================================
   СОХРАНЕНИЕ ПОСЕЩЕНИЯ
========================================================= */

function savePresence(
    showMessage = false
){

    const data = [];


    for(
        let i = 0;
        i < 5;
        i++
    ){

        const weekday =
            document.querySelector(
                `.weekday[data-week="${i}"]`
            )?.value || "";


        const weekend =
            document.querySelector(
                `.weekend[data-week="${i}"]`
            )?.value || "";


        data.push({
            weekday,
            weekend
        });
    }


    localStorage.setItem(

        presenceKey(
            loadedPresenceMonth
        ),

        JSON.stringify(data)
    );


    if(showMessage){

        setStatus(
            "✓ Посещение за " +
            monthName(
                loadedPresenceMonth
            ) +
            " сохранено"
        );
    }
}


/* =========================================================
   АВТОСОХРАНЕНИЕ ПОСЕЩЕНИЯ
========================================================= */

function schedulePresenceAutoSave(){

    clearTimeout(
        presenceAutoSaveTimer
    );


    presenceAutoSaveTimer =
        setTimeout(() => {

            savePresence(false);

        },400);
}


/* =========================================================
   ИТОГ ПОСЕЩЕНИЯ
========================================================= */

function calculatePresence(){

    let weekdays = 0;

    let weekends = 0;


    document
        .querySelectorAll(
            ".weekday"
        )
        .forEach(input => {

            if(
                input.value === ""
            ){
                return;
            }


            const value =
                Number(
                    input.value
                );


            if(
                Number.isFinite(
                    value
                )
            ){

                weekdays += value;
            }

        });


    document
        .querySelectorAll(
            ".weekend"
        )
        .forEach(input => {

            if(
                input.value === ""
            ){
                return;
            }


            const value =
                Number(
                    input.value
                );


            if(
                Number.isFinite(
                    value
                )
            ){

                weekends += value;
            }

        });


    document.getElementById(
        "weekdayTotal"
    ).textContent =
        formatNumber(
            weekdays
        );


    document.getElementById(
        "weekendTotal"
    ).textContent =
        formatNumber(
            weekends
        );


    document.getElementById(
        "presenceGrandTotal"
    ).textContent =
        formatNumber(
            weekdays +
            weekends
        );
}

/* =========================================================
   ПОЛНЫЙ РЕЗЕРВ
========================================================= */

function collectBackupData(){

    /*
        Сначала гарантированно сохраняем
        то, что сейчас открыто.
    */

    saveData(false);


    if(
        document
            .getElementById(
                "presenceModal"
            )
            .classList
            .contains("show")
    ){

        savePresence(false);
    }


    const data = {};


    /*
        Имена
    */

    data["journal-people"] =
        localStorage.getItem(
            "journal-people"
        ) ||
        JSON.stringify(
            Array(
                PEOPLE_COUNT
            ).fill("")
        );


    /*
        Все отчёты 12 месяцев.
    */

    for(
        let month = 1;
        month <= 12;
        month++
    ){

        const key =
            storageKey(month);

        data[key] =
            localStorage.getItem(
                key
            ) ||
            JSON.stringify([]);
    }


    /*
        Всё посещение 12 месяцев.
    */

    for(
        let month = 1;
        month <= 12;
        month++
    ){

        const key =
            presenceKey(month);

        data[key] =
            localStorage.getItem(
                key
            ) ||
            JSON.stringify([]);
    }


    return {

        backupVersion:3,

        app:"Журнал записей",

        createdAt:
            new Date()
            .toISOString(),

        peopleCount:
            PEOPLE_COUNT,

        data
    };
}


/* =========================================================
   СОХРАНЕНИЕ РЕЗЕРВА ФАЙЛОМ
========================================================= */

function exportBackup(){

    try{

        const backup =
            collectBackupData();


        const json =
            JSON.stringify(
                backup,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                    "application/json;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        const now =
            new Date();


        const date =
            [
                now.getFullYear(),

                String(
                    now.getMonth()+1
                ).padStart(2,"0"),

                String(
                    now.getDate()
                ).padStart(2,"0")

            ].join("-");


        const time =
            [
                String(
                    now.getHours()
                ).padStart(2,"0"),

                String(
                    now.getMinutes()
                ).padStart(2,"0")

            ].join("-");


        link.href =
            url;


        link.download =
            `journal-full-backup-${date}_${time}.json`;


        document.body
            .appendChild(link);


        link.click();


        link.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        setStatus(
            "✓ Полный резерв сохранён"
        );

    }
    catch(error){

        console.error(error);


        setStatus(
            "Ошибка создания резерва",
            true
        );
    }
}


/* =========================================================
   ВОССТАНОВЛЕНИЕ
========================================================= */

function restoreBackup(event){

    const file =
        event.target.files?.[0];


    if(!file){

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

        try{

            const backup =
                JSON.parse(
                    reader.result
                );


            if(
                !backup ||
                typeof backup !==
                "object"
            ){

                throw new Error(
                    "Неверный формат файла"
                );
            }


            if(
                backup.app !==
                "Журнал записей"
            ){

                throw new Error(
                    "Это не резерв журнала"
                );
            }


            if(
                !backup.data ||
                typeof backup.data !==
                "object"
            ){

                throw new Error(
                    "В резерве нет данных"
                );
            }


            const ok =
                confirm(
                    "Восстановить весь журнал?\n\n" +
                    "Будут восстановлены:\n" +
                    "• все имена\n" +
                    "• отчёты всех месяцев\n" +
                    "• посещение всех месяцев"
                );


            if(!ok){

                event.target.value =
                    "";

                return;
            }


            /*
                Удаляем только данные
                нашего журнала.
            */

            const deleteKeys = [];


            for(
                let i = 0;
                i < localStorage.length;
                i++
            ){

                const key =
                    localStorage.key(i);


                if(
                    key ===
                    "journal-people" ||

                    key?.startsWith(
                        "journal-month-"
                    ) ||

                    key?.startsWith(
                        "journal-presence-"
                    )
                ){

                    deleteKeys.push(
                        key
                    );
                }
            }


            deleteKeys
                .forEach(key => {

                    localStorage
                        .removeItem(
                            key
                        );

                });


            /*
                Возвращаем данные.
            */

            Object.entries(
                backup.data
            )
            .forEach(
                ([key,value]) => {

                    if(
                        key ===
                        "journal-people" ||

                        key.startsWith(
                            "journal-month-"
                        ) ||

                        key.startsWith(
                            "journal-presence-"
                        )
                    ){

                        JSON.parse(
                            value
                        );


                        localStorage
                            .setItem(
                                key,
                                value
                            );
                    }

                }
            );


            /*
                Перестраиваем интерфейс.
            */

            createPeople();

            loadMonth();

            createPresenceTable();

            loadPresence(
                currentMonth
            );


            setStatus(
                "✓ Весь журнал восстановлен"
            );


            alert(
                "Готово!\n\n" +
                "Восстановлены все отчёты " +
                "и посещение."
            );

        }
        catch(error){

            console.error(
                error
            );


            alert(
                "Не удалось восстановить файл.\n\n" +
                error.message
            );


            setStatus(
                "Ошибка восстановления",
                true
            );
        }


        event.target.value =
            "";
    };


    reader.onerror =
        function(){

            alert(
                "Не удалось прочитать файл"
            );


            event.target.value =
                "";
        };


    reader.readAsText(
        file,
        "UTF-8"
    );
}
