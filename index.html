<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>📋 Журнал записей</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef3ff,#f8f9ff,#edf7ff);
    color:#20242b;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.88);
    border-radius:20px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 8px 30px rgba(60,80,120,.12);
    backdrop-filter:blur(10px);
}

h1{
    margin:0 0 14px;
    text-align:center;
    font-size:25px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    align-items:center;
}

select,
button,
input{
    font:inherit;
}

select{
    padding:10px 12px;
    border:1px solid #d8deeb;
    border-radius:12px;
    background:white;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 13px;
    cursor:pointer;
    background:#eef2f8;
    transition:.15s;
}

button:hover{
    transform:translateY(-1px);
}

button:active{
    transform:scale(.97);
}

.btn-save{
    background:#dff6e7;
}

.btn-backup{
    background:#e4efff;
}

.btn-restore{
    background:#fff0d9;
}

.btn-cloud{
    background:#e8e4ff;
}

.btn-danger{
    background:#ffe3e3;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:#687386;
    min-height:18px;
}

.table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    background:#f0f3f8;
    font-weight:700;
}

th,
td{
    padding:8px;
    border-bottom:1px solid #e5e8ee;
    text-align:center;
}

td.name-cell{
    text-align:left;
    min-width:180px;
}

.name-input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    padding:8px;
    border-radius:8px;
}

.name-input:focus{
    border-color:#bfc9dc;
    background:white;
    outline:none;
}

.data-input{
    width:80px;
    padding:8px;
    border:1px solid #d8deeb;
    border-radius:8px;
    text-align:center;
    background:white;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.summary-box{
    background:#f5f7fb;
    border-radius:14px;
    padding:13px;
    text-align:center;
}

.summary-title{
    font-size:13px;
    color:#687386;
}

.summary-value{
    font-size:23px;
    font-weight:700;
    margin-top:4px;
}

.result-title{
    margin:0 0 12px;
}

.bottom{
    text-align:center;
    margin-top:10px;
}

.refresh{
    font-size:13px;
    padding:7px 11px;
    background:#f0f2f6;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(20,30,50,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:22px;
    padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.modal-head h2{
    margin:0;
    font-size:20px;
}

.close{
    width:38px;
    height:38px;
    padding:0;
    border-radius:50%;
    background:#f0f2f5;
}

.presence-table{
    min-width:430px;
}

.presence-input{
    width:90px;
    padding:9px;
    border:1px solid #d8deeb;
    border-radius:9px;
    text-align:center;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

.file-input{
    display:none;
}

.backup-info{
    margin-top:10px;
    padding:10px 12px;
    background:#f5f7fb;
    border-radius:12px;
    font-size:13px;
    color:#687386;
    text-align:center;
}

@media(max-width:650px){

    body{
        padding:8px;
    }

    .card{
        padding:11px;
        border-radius:16px;
    }

    h1{
        font-size:21px;
    }

    .controls{
        gap:6px;
    }

    .controls button,
    .controls select{
        padding:9px 10px;
        font-size:14px;
    }

    .summary{
        gap:6px;
    }

    .summary-box{
        padding:10px 5px;
    }

    .summary-value{
        font-size:19px;
    }

    .summary-title{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📋 Журнал записей</h1>

        <div class="controls">

            <select id="monthSelect"></select>

            <button class="btn-save" id="saveBtn">
                💾 Сохранить
            </button>

            <button class="btn-backup" id="backupBtn">
                💾 Резерв
            </button>

            <button class="btn-restore" id="restoreBtn">
                📂 Восстановить
            </button>

            <button class="btn-cloud" id="cloudBtn">
                ☁️ Облако
            </button>

            <button id="presenceBtn">
                👥
            </button>

            <button class="btn-danger" id="clearBtn">
                Очистить месяц
            </button>

        </div>

        <div id="status" class="status"></div>

        <input
            type="file"
            id="restoreFile"
            class="file-input"
            accept=".json,application/json"
        >

    </div>


    <div class="card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>№</th>
                        <th>Кто</th>
                        <th>Участие</th>
                        <th>Уроки</th>
                        <th>Баллы</th>
                    </tr>
                </thead>

                <tbody id="peopleBody"></tbody>

            </table>

        </div>

        <div class="summary">

            <div class="summary-box">
                <div class="summary-title">Участие / часы</div>
                <div class="summary-value" id="totalParticipation">0</div>
            </div>

            <div class="summary-box">
                <div class="summary-title">Уроки</div>
                <div class="summary-value" id="totalLessons">0</div>
            </div>

            <div class="summary-box">
                <div class="summary-title">Баллы</div>
                <div class="summary-value" id="totalPoints">0</div>
            </div>

        </div>

        <div class="bottom">
            <button class="refresh" id="refreshBtn">
                ↻ Обновить
            </button>
        </div>

    </div>


    <div class="card">

        <h2 class="result-title">📊 Итог за месяц</h2>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Показатель</th>
                        <th>Количество</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Участие / часы</td>
                        <td id="resultParticipation">0</td>
                    </tr>

                    <tr>
                        <td>Уроки</td>
                        <td id="resultLessons">0</td>
                    </tr>

                    <tr>
                        <td>Баллы</td>
                        <td id="resultPoints">0</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ==================== МОДАЛЬНОЕ ОКНО ПРИСУТСТВИЯ ==================== -->

<div class="modal" id="presenceModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>👥 Присутствие</h2>

            <button class="close" id="closePresence">
                ✕
            </button>

        </div>

        <select id="presenceMonth"></select>

        <div class="backup-info">
            Здесь записывается общее количество присутствующих.
            Данные сохраняются отдельно для каждого месяца.
        </div>

        <div class="table-wrap" style="margin-top:15px">

            <table class="presence-table">

                <thead>
                    <tr>
                        <th>Неделя</th>
                        <th>Будни</th>
                        <th>Вых.</th>
                    </tr>
                </thead>

                <tbody id="presenceBody"></tbody>

                <tfoot>

                    <tr>
                        <th>Итого</th>
                        <th id="weekdayTotal">0</th>
                        <th id="weekendTotal">0</th>
                    </tr>

                </tfoot>

            </table>

        </div>

        <div class="modal-buttons">

            <button id="presenceSaveBtn" class="btn-save">
                💾 Сохранить
            </button>

            <button id="presenceCloseBtn">
                Закрыть
            </button>

        </div>

    </div>

</div>


<script>

const PEOPLE_COUNT = 30;

const MONTHS = [
    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"
];

let currentMonth = new Date().getMonth() + 1;

let autoSaveTimer = null;
let presenceAutoSaveTimer = null;


/* =========================================================
   ОБЩИЕ ФУНКЦИИ
========================================================= */

function setStatus(text, good = true){

    const el = document.getElementById("status");

    el.textContent = text;

    el.style.color = good ? "#687386" : "#c0392b";

    clearTimeout(setStatus.timer);

    setStatus.timer = setTimeout(() => {
        el.textContent = "";
    }, 4000);
}


function monthName(month){

    return MONTHS[month - 1] || "";
}


function storageKey(month){

    return "journal-month-" + month;
}


function presenceKey(month){

    return "journal-presence-" + month;
}


/* =========================================================
   МЕСЯЦЫ
========================================================= */

function createMonthOptions(){

    const monthSelect =
        document.getElementById("monthSelect");

    const presenceMonth =
        document.getElementById("presenceMonth");

    monthSelect.innerHTML = "";
    presenceMonth.innerHTML = "";

    MONTHS.forEach((name, index) => {

        const month = index + 1;

        const option1 = document.createElement("option");

        option1.value = month;
        option1.textContent = name;

        monthSelect.appendChild(option1);


        const option2 = document.createElement("option");

        option2.value = month;
        option2.textContent = name;

        presenceMonth.appendChild(option2);

    });

    monthSelect.value = currentMonth;
    presenceMonth.value = currentMonth;
}


/* =========================================================
   ИМЕНА
========================================================= */

function getPeopleNames(){

    try{

        const saved =
            localStorage.getItem("journal-people");

        if(!saved){
            return Array(PEOPLE_COUNT).fill("");
        }

        const names = JSON.parse(saved);

        if(!Array.isArray(names)){
            return Array(PEOPLE_COUNT).fill("");
        }

        const result =
            Array(PEOPLE_COUNT).fill("");

        for(let i = 0; i < PEOPLE_COUNT; i++){

            result[i] = names[i] || "";

        }

        return result;

    }catch(e){

        return Array(PEOPLE_COUNT).fill("");

    }

}


function savePeopleNames(){

    const names = [];

    document
        .querySelectorAll(".name-input")
        .forEach(input => {

            names.push(input.value.trim());

        });

    localStorage.setItem(
        "journal-people",
        JSON.stringify(names)
    );
}


/* =========================================================
   СОЗДАНИЕ ЛЮДЕЙ
========================================================= */

function createPeople(){

    const body =
        document.getElementById("peopleBody");

    body.innerHTML = "";

    const names = getPeopleNames();

    for(let i = 0; i < PEOPLE_COUNT; i++){

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>${i + 1}</td>

            <td class="name-cell">
                <input
                    class="name-input"
                    data-index="${i}"
                    value="${escapeHtml(names[i])}"
                    placeholder="Введите имя"
                >
            </td>

            <td>
                <input
                    class="data-input participation"
                    data-index="${i}"
                    type="text"
                    inputmode="decimal"
                    placeholder="+"
                >
            </td>

            <td>
                <input
                    class="data-input lessons"
                    data-index="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </td>

            <td>
                <input
                    class="data-input points"
                    data-index="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </td>

        `;

        body.appendChild(tr);

    }


    document
        .querySelectorAll(".name-input")
        .forEach(input => {

            input.addEventListener("input", () => {

                savePeopleNames();

                scheduleAutoSave();

            });

        });


    document
        .querySelectorAll(".data-input")
        .forEach(input => {

            input.addEventListener("input", () => {

                updateResult();

                scheduleAutoSave();

            });

        });

}


/* =========================================================
   БЕЗОПАСНЫЙ ТЕКСТ ДЛЯ INPUT
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   ЗАГРУЗКА МЕСЯЦА
========================================================= */

function loadMonth(){

    const saved =
        localStorage.getItem(
            storageKey(currentMonth)
        );

    let data = [];

    if(saved){

        try{

            data = JSON.parse(saved);

        }catch(e){

            data = [];

        }

    }


    document
        .querySelectorAll(".participation")
        .forEach((input, index) => {

            input.value =
                data[index]?.participation ?? "";

        });


    document
        .querySelectorAll(".lessons")
        .forEach((input, index) => {

            input.value =
                data[index]?.lessons ?? "";

        });


    document
        .querySelectorAll(".points")
        .forEach((input, index) => {

            input.value =
                data[index]?.points ?? "";

        });


    updateResult();

}


/* =========================================================
   СОХРАНЕНИЕ МЕСЯЦА
========================================================= */

function saveData(showMessage = true){

    savePeopleNames();

    const data = [];

    for(let i = 0; i < PEOPLE_COUNT; i++){

        const participation =
            document.querySelector(
                `.participation[data-index="${i}"]`
            )?.value || "";

        const lessons =
            document.querySelector(
                `.lessons[data-index="${i}"]`
            )?.value || "";

        const points =
            document.querySelector(
                `.points[data-index="${i}"]`
            )?.value || "";


        data.push({

            participation,
            lessons,
            points

        });

    }


    localStorage.setItem(
        storageKey(currentMonth),
        JSON.stringify(data)
    );


    if(showMessage){

        setStatus(
            `✓ ${monthName(currentMonth)} сохранён`
        );

    }

}


/* =========================================================
   АВТОСОХРАНЕНИЕ
========================================================= */

function scheduleAutoSave(){

    clearTimeout(autoSaveTimer);

    autoSaveTimer = setTimeout(() => {

        saveData(false);

    }, 500);

}


/* =========================================================
   ИТОГИ
========================================================= */

function updateResult(){

    let participation = 0;
    let lessons = 0;
    let points = 0;


    document
        .querySelectorAll(".participation")
        .forEach(input => {

            const value =
                String(input.value).trim().replace(",", ".");

            /*
              "+" считается как 1 участие.
              Число считается как количество часов.
            */

            if(value === "+"){

                participation += 1;

            }else if(value !== ""){

                const number =
                    parseFloat(value);

                if(!isNaN(number)){

                    participation += number;

                }

            }

        });


    document
        .querySelectorAll(".lessons")
        .forEach(input => {

            const value =
                parseFloat(input.value);

            if(!isNaN(value)){

                lessons += value;

            }

        });


    document
        .querySelectorAll(".points")
        .forEach(input => {

            const value =
                parseFloat(input.value);

            if(!isNaN(value)){

                points += value;

            }

        });


    document.getElementById(
        "totalParticipation"
    ).textContent = participation;


    document.getElementById(
        "totalLessons"
    ).textContent = lessons;


    document.getElementById(
        "totalPoints"
    ).textContent = points;


    document.getElementById(
        "resultParticipation"
    ).textContent = participation;


    document.getElementById(
        "resultLessons"
    ).textContent = lessons;


    document.getElementById(
        "resultPoints"
    ).textContent = points;

}


/* =========================================================
   ПРИСУТСТВИЕ
========================================================= */

function createPresenceTable(){

    const body =
        document.getElementById("presenceBody");

    body.innerHTML = "";

    for(let i = 0; i < 5; i++){

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${i + 1}</td>

            <td>
                <input
                    class="presence-input weekday"
                    data-week="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </td>

            <td>
                <input
                    class="presence-input weekend"
                    data-week="${i}"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </td>

        `;

        body.appendChild(tr);

    }


    document
        .querySelectorAll(".presence-input")
        .forEach(input => {

            input.addEventListener("input", () => {

                calculatePresence();

                schedulePresenceAutoSave();

            });

        });

}


function loadPresence(){

    const saved =
        localStorage.getItem(
            presenceKey(
                Number(
                    document.getElementById(
                        "presenceMonth"
                    ).value
                )
            )
        );


    let data = [];

    if(saved){

        try{

            data = JSON.parse(saved);

        }catch(e){

            data = [];

        }

    }


    document
        .querySelectorAll(".weekday")
        .forEach((input, index) => {

            input.value =
                data[index]?.weekday ?? "";

        });


    document
        .querySelectorAll(".weekend")
        .forEach((input, index) => {

            input.value =
                data[index]?.weekend ?? "";

        });


    calculatePresence();

}


function savePresence(showMessage = true){

    const month =
        Number(
            document.getElementById(
                "presenceMonth"
            ).value
        );


    const data = [];

    for(let i = 0; i < 5; i++){

        const weekday =
            document.querySelector(
                `.weekday[data-week="${i}"]`
            )?.value || "";

        const weekend =
            document.querySelector(
                `.weekend[data-week="${i}"]`
            )?.value || "";


        data.push({

            weekday,
            weekend

        });

    }


    localStorage.setItem(
        presenceKey(month),
        JSON.stringify(data)
    );


    if(showMessage){

        setStatus(
            `✓ Присутствие за ${monthName(month)} сохранено`
        );

    }

}


function schedulePresenceAutoSave(){

    clearTimeout(presenceAutoSaveTimer);

    presenceAutoSaveTimer = setTimeout(() => {

        savePresence(false);

    }, 500);

}


function calculatePresence(){

    let weekdays = 0;
    let weekends = 0;


    document
        .querySelectorAll(".weekday")
        .forEach(input => {

            const value =
                parseFloat(input.value);

            if(!isNaN(value)){

                weekdays += value;

            }

        });


    document
        .querySelectorAll(".weekend")
        .forEach(input => {

            const value =
                parseFloat(input.value);

            if(!isNaN(value)){

                weekends += value;

            }

        });


    document.getElementById(
        "weekdayTotal"
    ).textContent = weekdays;


    document.getElementById(
        "weekendTotal"
    ).textContent = weekends;

}


/* =========================================================
   МОДАЛЬНОЕ ОКНО
========================================================= */

function togglePresence(show){

    const modal =
        document.getElementById(
            "presenceModal"
        );

    if(show){

        modal.classList.add("show");

        document.getElementById(
            "presenceMonth"
        ).value = currentMonth;

        loadPresence();

    }else{

        savePresence(false);

        modal.classList.remove("show");

    }

}


/* =========================================================
   РЕЗЕРВНАЯ КОПИЯ
========================================================= */

function collectBackupData(){

    /*
      Перед созданием резервной копии
      сначала сохраняем текущие данные.
    */

    saveData(false);

    if(
        document
            .getElementById("presenceModal")
            .classList.contains("show")
    ){

        savePresence(false);

    }


    const data = {};

    for(let i = 0; i < localStorage.length; i++){

        const key =
            localStorage.key(i);

        if(!key){
            continue;
        }


        if(
            key === "journal-people" ||
            key.startsWith("journal-month-") ||
            key.startsWith("journal-presence-")
        ){

            data[key] =
                localStorage.getItem(key);

        }

    }


    return {

        backupVersion: 1,

        app: "Журнал записей",

        createdAt:
            new Date().toISOString(),

        data

    };

}


function exportBackup(){

    try{

        const backup =
            collectBackupData();


        const json =
            JSON.stringify(
                backup,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:"application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        const now =
            new Date();


        const date =
            now.toISOString()
                .slice(0,10);


        const time =
            now.toTimeString()
                .slice(0,5)
                .replace(":", "-");


        link.href = url;

        link.download =
            `journal-backup-${date}_${time}.json`;


        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);


        setStatus(
            "✓ Резервная копия сохранена в файл"
        );

    }catch(error){

        console.error(error);

        setStatus(
            "Ошибка создания резервной копии",
            false
        );

    }

}


/* =========================================================
   ВОССТАНОВЛЕНИЕ ИЗ ФАЙЛА
========================================================= */

function restoreBackup(event){

    const file =
        event.target.files?.[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(){

        try{

            const backup =
                JSON.parse(
                    reader.result
                );


            /*
              Проверяем, что это действительно
              резервная копия нашего журнала.
            */

            if(
                !backup ||
                typeof backup !== "object"
            ){

                throw new Error(
                    "Файл имеет неверный формат"
                );

            }


            if(
                backup.app !==
                "Журнал записей"
            ){

                throw new Error(
                    "Это не резервная копия журнала"
                );

            }


            if(
                !backup.data ||
                typeof backup.data !== "object"
            ){

                throw new Error(
                    "В резервной копии нет данных"
                );

            }


            if(
                backup.backupVersion > 1
            ){

                throw new Error(
                    "Версия резервной копии слишком новая"
                );

            }


            const confirmed =
                confirm(
                    "Восстановить данные из этого файла?\n\n" +
                    "Текущие данные журнала будут заменены " +
                    "данными из резервной копии."
                );


            if(!confirmed){

                event.target.value = "";

                return;

            }


            /*
              Удаляем только данные нашего журнала.
              Остальной localStorage сайта не трогаем.
            */

            const keysToDelete = [];

            for(let i = 0; i < localStorage.length; i++){

                const key =
                    localStorage.key(i);

                if(
                    key === "journal-people" ||
                    key?.startsWith("journal-month-") ||
                    key?.startsWith("journal-presence-")
                ){

                    keysToDelete.push(key);

                }

            }


            keysToDelete.forEach(key => {

                localStorage.removeItem(key);

            });


            /*
              Восстанавливаем данные.
            */

            Object.entries(
                backup.data
            ).forEach(([key,value]) => {

                if(
                    key === "journal-people" ||
                    key.startsWith("journal-month-") ||
                    key.startsWith("journal-presence-")
                ){

                    /*
                      Проверяем JSON перед записью.
                    */

                    JSON.parse(value);

                    localStorage.setItem(
                        key,
                        value
                    );

                }

            });


            /*
              Перестраиваем страницу.
            */

            createPeople();

            loadMonth();

            createPresenceTable();

            document.getElementById(
                "presenceMonth"
            ).value = currentMonth;

            loadPresence();


            setStatus(
                "✓ Данные успешно восстановлены"
            );


        }catch(error){

            console.error(error);

            alert(
                "Не удалось восстановить резервную копию.\n\n" +
                error.message
            );

            setStatus(
                "Ошибка восстановления",
                false
            );

        }


        event.target.value = "";

    };


    reader.onerror = function(){

        alert(
            "Не удалось прочитать файл."
        );

        event.target.value = "";

    };


    reader.readAsText(
        file,
        "UTF-8"
    );

}


/* =========================================================
   ОБЛАКО
========================================================= */

function cloudSync(){

    /*
      Пока облако не подключено.
      Здесь намеренно НЕ делаем вид,
      что данные действительно отправляются
      в интернет.
    */

    saveData(false);

    savePresence(false);

    alert(
        "☁️ Облачное сохранение пока не подключено.\n\n" +
        "Локальные данные сохранены.\n\n" +
        "Для настоящего облачного хранения нужно " +
        "подключить серверную базу данных."
    );

}


/* =========================================================
   ОЧИСТКА МЕСЯЦА
========================================================= */

function clearMonth(){

    const confirmed =
        confirm(
            `Очистить все данные за ${monthName(currentMonth)}?\n\n` +
            "Имена людей НЕ будут удалены."
        );


    if(!confirmed){
        return;
    }


    localStorage.removeItem(
        storageKey(currentMonth)
    );


    loadMonth();


    setStatus(
        `✓ ${monthName(currentMonth)} очищен`
    );

}


/* =========================================================
   СОБЫТИЯ
========================================================= */

document
    .getElementById("monthSelect")
    .addEventListener("change", function(){

        saveData(false);

        currentMonth =
            Number(this.value);

        loadMonth();

        /*
          Если окно присутствия открыто —
          переключаем и его.
        */

        document.getElementById(
            "presenceMonth"
        ).value = currentMonth;

        loadPresence();

    });


document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        () => saveData(true)
    );


document
    .getElementById("backupBtn")
    .addEventListener(
        "click",
        exportBackup
    );


document
    .getElementById("restoreBtn")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("restoreFile")
                .click();

        }
    );


document
    .getElementById("restoreFile")
    .addEventListener(
        "change",
        restoreBackup
    );


document
    .getElementById("cloudBtn")
    .addEventListener(
        "click",
        cloudSync
    );


document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        clearMonth
    );


document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        () => {

            saveData(false);

            createPeople();

            loadMonth();

            setStatus("✓ Страница обновлена");

        }
    );


document
    .getElementById("presenceBtn")
    .addEventListener(
        "click",
        () => togglePresence(true)
    );


document
    .getElementById("closePresence")
    .addEventListener(
        "click",
        () => togglePresence(false)
    );


document
    .getElementById("presenceCloseBtn")
    .addEventListener(
        "click",
        () => togglePresence(false)
    );


document
    .getElementById("presenceSaveBtn")
    .addEventListener(
        "click",
        () => savePresence(true)
    );


document
    .getElementById("presenceMonth")
    .addEventListener("change", function(){

        /*
          Сначала сохраняем предыдущий выбранный месяц.
        */

        savePresence(false);

        loadPresence();

    });


document
    .getElementById("presenceModal")
    .addEventListener("click", function(event){

        if(event.target === this){

            togglePresence(false);

        }

    });


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            document
                .getElementById("presenceModal")
                .classList.contains("show")
        ){

            togglePresence(false);

        }

    }
);


/* =========================================================
   ЗАПУСК
========================================================= */

createMonthOptions();

createPeople();

createPresenceTable();

loadMonth();

</script>
