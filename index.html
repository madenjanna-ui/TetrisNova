<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Журнал записей</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8faff);
    color: #202124;
    min-height: 100vh;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

header {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
    margin-bottom: 18px;
}

h1 {
    margin: 0 0 15px;
    font-size: 25px;
}

h2 {
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

select,
button,
input {
    font: inherit;
}

select {
    border: 0;
    background: #fff;
    padding: 12px 15px;
    border-radius: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

button {
    border: 0;
    border-radius: 13px;
    padding: 12px 16px;
    cursor: pointer;
    background: #635bff;
    color: white;
    font-weight: 600;
}

button.secondary {
    background: #e9e9f5;
    color: #333;
}

button.danger {
    background: #ff5c67;
}

.card {
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    text-align: left;
    font-size: 13px;
    color: #666;
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
}

td {
    padding: 8px;
    border-bottom: 1px solid #eee;
}

.number {
    width: 35px;
    color: #888;
    text-align: center;
}

.name {
    min-width: 180px;
}

.name input {
    width: 100%;
    border: 0;
    background: transparent;
    font-weight: 600;
    outline: none;
    padding: 9px 5px;
}

.data-input {
    width: 100%;
    max-width: 120px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 10px;
    padding: 9px;
    text-align: center;
    outline: none;
}

.data-input:focus,
.name input:focus {
    border-color: #635bff;
}

.summary {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.summary-box {
    background: rgba(255,255,255,.8);
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.summary-title {
    font-size: 12px;
    color: #777;
}

.summary-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
}

.result {
    margin-top: 20px;
}

.result h2 {
    font-size: 19px;
    margin: 0 0 12px;
}

.saved {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 12px;
}

/* Присутствие */

.presence {
    display: none;
    margin-top: 20px;
}

.presence h2 {
    font-size: 19px;
}

.presence-input {
    width: 80px;
    padding: 9px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
    outline: none;
}

.presence-input:focus {
    border-color: #635bff;
}

.presence-total {
    font-weight: 700;
}

/* Кнопка обновления */

.update-button {
    text-align: center;
    margin: 20px 0 10px;
}

.update-button button {
    background: rgba(255,255,255,.7);
    color: #666;
    border: 1px solid rgba(0,0,0,.08);
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    box-shadow: none;
}

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    header {
        border-radius: 17px;
        padding: 15px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 22px;
    }

    button,
    select {
        flex: 1;
    }
}
</style>
</head>


<body>

<div class="container">

<header>

    <h1>📋 Журнал записей</h1>

    <div class="controls">

        <select id="month"></select>

        <button onclick="saveData()">
            💾 Сохранить
        </button>

        <button class="secondary" onclick="togglePresence()">
            👥
        </button>

        <button class="secondary" onclick="clearMonth()">
            Очистить месяц
        </button>

    </div>

    <div class="saved" id="savedMessage">
        Выберите месяц
    </div>

</header>


<!-- ОСНОВНАЯ ТАБЛИЦА -->

<div class="card">

<table>

<thead>

<tr>
    <th class="number">№</th>
    <th>Кто</th>
    <th>Участие</th>
    <th>Уроки</th>
    <th>Баллы</th>
</tr>

</thead>

<tbody id="peopleTable"></tbody>

</table>

</div>


<!-- ИТОГИ -->

<div class="summary">

<div class="summary-box">

    <div class="summary-title">
        Участие / часы
    </div>

    <div class="summary-value" id="totalParticipation">
        0
    </div>

</div>


<div class="summary-box">

    <div class="summary-title">
        Уроки
    </div>

    <div class="summary-value" id="totalLessons">
        0
    </div>

</div>


<div class="summary-box">

    <div class="summary-title">
        Баллы
    </div>

    <div class="summary-value" id="totalPoints">
        0
    </div>

</div>

</div>


<!-- ИТОГОВАЯ ТАБЛИЦА -->

<div class="card result">

<h2>📊 Итог за месяц</h2>

<table>

<thead>

<tr>
    <th>Кто</th>
    <th>Участие</th>
    <th>Уроки</th>
    <th>Баллы</th>
</tr>

</thead>

<tbody id="resultTable"></tbody>

</table>

</div>


<!-- ОТДЕЛЬНАЯ ТАБЛИЦА ПРИСУТСТВИЯ -->

<div class="card presence" id="presenceBlock">

<h2>👥 Присутствие учеников</h2>

<table>

<thead>

<tr>
    <th>Неделя</th>
    <th>Будни</th>
    <th>Вых.</th>
</tr>

</thead>

<tbody id="presenceTable"></tbody>

<tfoot>

<tr>

    <th>Итого</th>

    <th
        class="presence-total"
        id="presenceWeekdaysTotal">
        0
    </th>

    <th
        class="presence-total"
        id="presenceWeekendTotal">
        0
    </th>

</tr>

</tfoot>

</table>

<br>

<button onclick="savePresence()">
    💾 Сохранить присутствие
</button>

</div>


<!-- ОБНОВИТЬ -->

<div class="update-button">

    <button onclick="location.reload()">
        ↻ Обновить
    </button>

</div>


</div>


<script>

/* =========================
   НАСТРОЙКИ
========================= */

const PEOPLE_COUNT = 30;

const months = [
    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"
];


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const monthSelect =
    document.getElementById("month");

const peopleTable =
    document.getElementById("peopleTable");

const resultTable =
    document.getElementById("resultTable");


/* =========================
   МЕСЯЦЫ
========================= */

months.forEach((month, index) => {

    const option =
        document.createElement("option");

    option.value = index + 1;

    option.textContent = month;

    monthSelect.appendChild(option);

});

monthSelect.value =
    new Date().getMonth() + 1;


/* =========================
   ОБЩИЙ СПИСОК УЧАСТНИКОВ
========================= */

function getPeopleNames() {

    const saved =
        JSON.parse(
            localStorage.getItem("journal-people")
            || "null"
        );

    if (saved && Array.isArray(saved)) {
        return saved;
    }

    return Array(PEOPLE_COUNT).fill("");

}


function savePeopleNames() {

    const names = [];

    for (let i = 1; i <= PEOPLE_COUNT; i++) {

        names.push(
            document.getElementById(
                `name-${i}`
            ).value
        );

    }

    localStorage.setItem(
        "journal-people",
        JSON.stringify(names)
    );

}


/* =========================
   СОЗДАНИЕ УЧАСТНИКОВ
========================= */

function createPeople() {

    peopleTable.innerHTML = "";

    const names = getPeopleNames();

    for (let i = 1; i <= PEOPLE_COUNT; i++) {

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td class="number">
                ${i}
            </td>

            <td class="name">

                <input
                    type="text"
                    id="name-${i}"
                    placeholder="Имя ${i}"
                    value="${escapeHTML(
                        names[i - 1] || ""
                    )}"
                    onchange="savePeopleNames(); updateResult()"
                >

            </td>

            <td>

                <input
                    class="data-input"
                    id="participation-${i}"
                    placeholder="+ или часы"
                    oninput="updateResult()"
                >

            </td>

            <td>

                <input
                    class="data-input"
                    id="lessons-${i}"
                    type="number"
                    min="0"
                    placeholder="0"
                    oninput="updateResult()"
                >

            </td>

            <td>

                <input
                    class="data-input"
                    id="points-${i}"
                    type="number"
                    min="0"
                    placeholder="0"
                    oninput="updateResult()"
                >

            </td>
        `;

        peopleTable.appendChild(tr);

    }

}


/* =========================
   КЛЮЧ МЕСЯЦА
========================= */

function storageKey() {

    return "journal-month-" +
        monthSelect.value;

}


/* =========================
   ЗАГРУЗКА МЕСЯЦА
========================= */

function loadMonth() {

    const data =
        JSON.parse(
            localStorage.getItem(
                storageKey()
            ) || "null"
        );


    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        document.getElementById(
            `participation-${i}`
        ).value =
            data?.people?.[i - 1]?.participation
            || "";

        document.getElementById(
            `lessons-${i}`
        ).value =
            data?.people?.[i - 1]?.lessons
            || "";

        document.getElementById(
            `points-${i}`
        ).value =
            data?.people?.[i - 1]?.points
            || "";

    }


    updateResult();

    loadPresence();


    document.getElementById(
        "savedMessage"
    ).textContent = data
        ? "Записи загружены"
        : "Для этого месяца записей пока нет";

}


/* =========================
   СОХРАНЕНИЕ ОСНОВНЫХ ДАННЫХ
========================= */

function saveData() {

    savePeopleNames();

    const people = [];

    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        people.push({

            participation:
                document.getElementById(
                    `participation-${i}`
                ).value,

            lessons:
                document.getElementById(
                    `lessons-${i}`
                ).value,

            points:
                document.getElementById(
                    `points-${i}`
                ).value

        });

    }


    localStorage.setItem(

        storageKey(),

        JSON.stringify({
            people: people
        })

    );


    document.getElementById(
        "savedMessage"
    ).textContent =
        "✓ Сохранено";

}


/* =========================
   ИТОГОВАЯ ТАБЛИЦА
========================= */

function updateResult() {

    resultTable.innerHTML = "";

    let totalLessons = 0;
    let totalPoints = 0;
    let totalHours = 0;


    for (
        let i = 1;
        i <= PEOPLE_COUNT;
        i++
    ) {

        const name =
            document.getElementById(
                `name-${i}`
            ).value.trim();

        const participation =
            document.getElementById(
                `participation-${i}`
            ).value.trim();

        const lessons =
            Number(
                document.getElementById(
                    `lessons-${i}`
                ).value
            ) || 0;

        const points =
            Number(
                document.getElementById(
                    `points-${i}`
                ).value
            ) || 0;


        totalLessons += lessons;

        totalPoints += points;


        if (
            participation !== "+" &&
            participation !== "" &&
            !isNaN(Number(participation))
        ) {

            totalHours +=
                Number(participation);

        }


        if (
            name ||
            participation ||
            lessons ||
            points
        ) {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

                <td>
                    ${escapeHTML(
                        name || "Без имени"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        participation || "—"
                    )}
                </td>

                <td>
                    ${lessons}
                </td>

                <td>
                    ${points}
                </td>

            `;

            resultTable.appendChild(tr);

        }

    }


    document.getElementById(
        "totalParticipation"
    ).textContent =
        totalHours > 0
        ? totalHours + " ч"
        : "—";


    document.getElementById(
        "totalLessons"
    ).textContent =
        totalLessons;


    document.getElementById(
        "totalPoints"
    ).textContent =
        totalPoints;

}


/* =========================
   ПРИСУТСТВИЕ 👥
========================= */

function togglePresence() {

    const block =
        document.getElementById(
            "presenceBlock"
        );


    if (
        block.style.display === "none" ||
        block.style.display === ""
    ) {

        block.style.display = "block";

        createPresenceTable();

        loadPresence();

    } else {

        block.style.display = "none";

    }

}


/* =========================
   СОЗДАНИЕ ТАБЛИЦЫ
========================= */

function createPresenceTable() {

    const table =
        document.getElementById(
            "presenceTable"
        );

    table.innerHTML = "";


    for (let i = 1; i <= 5; i++) {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                ${i} неделя
            </td>

            <td>

                <input
                    type="number"
                    min="0"
                    class="presence-input"
                    id="presence-weekday-${i}"
                    oninput="calculatePresence()"
                >

            </td>

            <td>

                <input
                    type="number"
                    min="0"
                    class="presence-input"
                    id="presence-weekend-${i}"
                    oninput="calculatePresence()"
                >

            </td>

        `;


        table.appendChild(tr);

    }

}


/* =========================
   КЛЮЧ ПРИСУТСТВИЯ
========================= */

function presenceKey() {

    return "journal-presence-" +
        monthSelect.value;

}


/* =========================
   СОХРАНИТЬ ПРИСУТСТВИЕ
========================= */

function savePresence() {

    const weeks = [];

    for (let i = 1; i <= 5; i++) {

        weeks.push({

            weekdays:
                document.getElementById(
                    `presence-weekday-${i}`
                ).value,

            weekend:
                document.getElementById(
                    `presence-weekend-${i}`
                ).value

        });

    }


    localStorage.setItem(

        presenceKey(),

        JSON.stringify(weeks)

    );


    alert("✓ Присутствие сохранено");

}


/* =========================
   ЗАГРУЗИТЬ ПРИСУТСТВИЕ
========================= */

function loadPresence() {

    const data =
        JSON.parse(
            localStorage.getItem(
                presenceKey()
            ) || "null"
        );


    if (!data) {

        for (let i = 1; i <= 5; i++) {

            const weekday =
                document.getElementById(
                    `presence-weekday-${i}`
                );

            const weekend =
                document.getElementById(
                    `presence-weekend-${i}`
                );

            if (weekday) weekday.value = "";

            if (weekend) weekend.value = "";

        }

        calculatePresence();

        return;

    }


    for (let i = 1; i <= 5; i++) {

        const weekday =
            document.getElementById(
                `presence-weekday-${i}`
            );

        const weekend =
            document.getElementById(
                `presence-weekend-${i}`
            );


        if (weekday) {

            weekday.value =
                data[i - 1]?.weekdays || "";

        }


        if (weekend) {

            weekend.value =
                data[i - 1]?.weekend || "";

        }

    }


    calculatePresence();

}


/* =========================
   ИТОГ ПРИСУТСТВИЯ
========================= */

function calculatePresence() {

    let weekdays = 0;
    let weekends = 0;


    document
        .querySelectorAll(
            ".presence-input"
        )
        .forEach(input => {

            const value =
                Number(input.value) || 0;

            if (
                input.id.includes(
                    "weekday"
                )
            ) {

                weekdays += value;

            } else {

                weekends += value;

            }

        });


    document.getElementById(
        "presenceWeekdaysTotal"
    ).textContent =
        weekdays;


    document.getElementById(
        "presenceWeekendTotal"
    ).textContent =
        weekends;

}


/* =========================
   ОЧИСТИТЬ МЕСЯЦ
========================= */

function clearMonth() {

    if (
        !confirm(
            "Удалить записи за " +
            months[
                monthSelect.value - 1
            ] +
            "?"
        )
    ) return;


    localStorage.removeItem(
        storageKey()
    );

    localStorage.removeItem(
        presenceKey()
    );


    loadMonth();

}


/* =========================
   ЗАЩИТА ИМЁН
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   ПЕРЕКЛЮЧЕНИЕ МЕСЯЦА
========================= */

monthSelect.addEventListener(
    "change",
    loadMonth
);


/* =========================
   ЗАПУСК
========================= */

createPeople();

loadMonth();

</script>

</body>
</html>
